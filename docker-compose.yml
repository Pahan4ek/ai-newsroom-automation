services:
  n8n:
    # Pinned on purpose: the workflows rely on n8n 2.x behaviour (Data tables by name, $env access flag).
    image: docker.n8n.io/n8nio/n8n:2.46.6
    container_name: n8n-newsroom
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Kyiv}
      # n8n 2.0+ blocks $env in expressions by default. The workflows read tokens and IDs from env,
      # so access has to be switched back on.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_MODERATION_CHAT_ID=${TELEGRAM_MODERATION_CHAT_ID}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - LLM_API_URL=${LLM_API_URL:-http://host.docker.internal:1234/v1/chat/completions}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - n8n_data:/home/node/.n8n
      # mounted read-only so the CLI import in the README can see the workflow files
      - ./workflows:/workflows:ro
    extra_hosts:
      # lets the container reach a model server running on the host (LM Studio / Ollama)
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
